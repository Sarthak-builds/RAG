name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gate:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Provision frontend dependencies
        run: npm ci --prefix frontend

      - name: Run the single quality gate
        run: just check
