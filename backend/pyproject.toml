[project]
name = "app"
version = "0.0.0"
description = "RAG backend: domain -> application -> adapters -> interfaces."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic-settings>=1.0", "alembic>=1.14", "sqlalchemy>=2.0", "psycopg2-binary>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.14", "import-linter>=2.0", "testcontainers[postgres]>=4.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
